name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version in the app's corner is `git rev-list --count HEAD`,
          # and the default shallow checkout has one commit to count. Without
          # this the number would reset to 1 on every deploy — build.ts
          # refuses to publish a number it can't trust, so the app would say
          # "dev" instead of lying, but this is what keeps it honest.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      # Pushes land straight on main with no PR review, so this is the only
      # gate on the service worker's offline behavior before it goes live.
      - run: bun test
      - run: bun run build
      - run: cp -r public/. dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
